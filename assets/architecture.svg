<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2568a8"/></marker></defs><rect width="1200" height="640" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#2c2c2b}.title{font-size:28px;font-weight:bold}.label{font-size:20px;font-weight:bold}.small{font-size:17px;fill:#67645f}.box{fill:#f9f8f7;stroke:#c6c4c0;stroke-width:2}.line{stroke:#2568a8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text class="title" x="40" y="48">Как информация интерфейса становится доступной</text><text class="small" x="40" y="80">Учебная схема: UI Automation — исследуемый в работе канал</text><rect class="box" x="40" y="170" width="200" height="90" rx="10"/><text class="label" x="140.0" y="205" text-anchor="middle">Пользователь</text><text class="small" x="140.0" y="234" text-anchor="middle">слух и осязание</text><rect class="box" x="330" y="170" width="200" height="90" rx="10"/><text class="label" x="430.0" y="205" text-anchor="middle">Скринридер</text><text class="small" x="430.0" y="234" text-anchor="middle">NVDA / Narrator</text><rect class="box" x="640" y="170" width="200" height="90" rx="10"/><text class="label" x="740.0" y="205" text-anchor="middle">UI Automation</text><text class="small" x="740.0" y="234" text-anchor="middle">запросы и события</text><rect class="box" x="950" y="170" width="210" height="90" rx="10"/><text class="label" x="1055.0" y="205" text-anchor="middle">Приложение</text><text class="small" x="1055.0" y="234" text-anchor="middle">UIA-провайдер</text><rect class="box" x="330" y="380" width="200" height="82" rx="10"/><text class="label" x="430.0" y="415" text-anchor="middle">Синтез речи</text><text class="small" x="430.0" y="444" text-anchor="middle">озвучивание</text><rect class="box" x="640" y="380" width="200" height="82" rx="10"/><text class="label" x="740.0" y="415" text-anchor="middle">Брайль</text><text class="small" x="740.0" y="444" text-anchor="middle">строка / дисплей</text><rect class="box" x="950" y="380" width="210" height="82" rx="10"/><text class="label" x="1055.0" y="415" text-anchor="middle">Дерево</text><text class="small" x="1055.0" y="444" text-anchor="middle">имя, роль, состояние</text><path class="line" d="M240 190H330"/><text class="small" x="250" y="140">Клавиатура</text><path class="line" d="M530 190H640"/><text class="small" x="545" y="140">Действия</text><path class="line" d="M840 190H950"/><path class="line" d="M950 240H840"/><path class="line" d="M640 240H530"/><text class="small" x="548" y="300">Свойства и события ← от приложения</text><path class="line" d="M1055 260V380"/><path class="line" d="M405 260V380"/><path class="line" d="M470 260V340H740V380"/><path class="line" d="M330 420H140V260"/><text class="small" x="180" y="402">Звук</text><path class="line" d="M740 462V520H90V260"/><text class="small" x="360" y="508">Брайлевское представление</text><text class="small" x="40" y="574">Обычные нажатия могут идти в приложение напрямую; UIA позволяет вызывать поддерживаемые действия.</text><text class="small" x="40" y="605">Конкретный скринридер может использовать и другие API: например, IAccessible2 или MSAA.</text></svg>